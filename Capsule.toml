[package]
name = "astrid-capsule-identity"
version = "0.2.0"
description = "Agent identity capsule — owns spark config, builds system prompt"
authors = ["Astrid Core Team"]
astrid-version = ">=0.1.0"

[[component]]
id = "identity-builder"
file = "astrid_capsule_identity.wasm"
type = "executable"
capabilities = { fs_read = ["cwd://"], fs_write = ["cwd://"] }

[exports.astrid]
spark = "1.0.0"

[env]
# Name of the project folder used for identity export/import (set by the distro).
# Override to rebrand without forking: set cwd_dir = ".myagent" in your Distro.toml.
cwd_dir = { prompt = "Project folder name (e.g. .astrid)", secret = false }

[capabilities]
ipc_publish = ["spark.v1.response.ready", "agent.v1.response"]

[[interceptor]]
event = "spark.v1.request.build"
action = "handle_build_request"

[[interceptor]]
event = "cli.v1.command.execute"
action = "handle_command"

[[command]]
name = "identity-export"
description = "Export agent identity (spark config) to {cwd_dir}/spark.toml"

[[command]]
name = "identity-import"
description = "Import agent identity from {cwd_dir}/spark.toml into KV store"
